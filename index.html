<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑆𝑡𝑎𝑡𝑖𝑠𝑡𝑖𝑐𝑠 𝐶𝑎𝑙𝑐𝑢𝑙𝑎𝑡𝑜𝑟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 text-slate-800">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <div class="inline-flex items-center justify-center p-3 bg-blue-600 rounded-2xl shadow-lg mb-4">
                <i data-lucide="calculator" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 mb-2">대표값 계산기</h1>
            <p class="text-slate-500">평균, 중앙값, 최빈값 등 대표값을 한 번에 계산하세요.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-1 space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 h-full">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold flex items-center gap-2">
                            <i data-lucide="hash" class="w-5 h-5 text-blue-500"></i>
                            숫자 입력
                        </h2>
                        <button onclick="loadExample()" class="text-xs text-blue-600 hover:text-blue-800 font-medium px-2 py-1 rounded bg-blue-50 hover:bg-blue-100 transition-colors">
                            예제 넣기
                        </button>
                    </div>
                    
                    <textarea id="inputText"
                        class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none text-slate-700 placeholder-slate-400 transition-all"
                        placeholder="숫자를 입력하세요.&#13;&#10;(쉼표, 공백, 줄바꿈으로 구분)"></textarea>
                    
                    <div id="errorMessage" class="hidden mt-2 p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-center gap-2">
                        <i data-lucide="info" class="w-4 h-4 flex-shrink-0"></i>
                        <span id="errorText"></span>
                    </div>

                    <div class="mt-4 grid grid-cols-2 gap-3">
                        <button onclick="handleClear()" class="whitespace-nowrap flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all font-medium">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            초기화
                        </button>
                        <button onclick="handleCalculate()" class="whitespace-nowrap flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-blue-600 text-white hover:bg-blue-700 shadow-md hover:shadow-lg transition-all font-medium">
                            <i data-lucide="calculator" class="w-4 h-4"></i>
                            계산하기
                        </button>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2">
                <div id="captureArea" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-semibold flex items-center gap-2">
                            <i data-lucide="bar-chart-3" class="w-5 h-5 text-indigo-500"></i>
                            계산 결과
                        </h2>
                        <div id="actionButtons" class="hidden flex items-center gap-1">
                            <button onclick="copyResult()" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors" title="결과 복사">
                                <i data-lucide="copy" class="w-5 h-5"></i>
                            </button>
                            <button onclick="downloadImage()" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors" title="이미지로 저장">
                                <i data-lucide="download" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div id="placeholderState" class="h-64 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-100 rounded-xl">
                        <i data-lucide="bar-chart-3" class="w-12 h-12 mb-3 opacity-20"></i>
                        <p>숫자를 입력하고 계산 버튼을 눌러주세요</p>
                    </div>

                    <div id="resultState" class="hidden space-y-6">
                        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl p-6 text-white shadow-lg transform transition-all hover:scale-[1.02]">
                            <div class="text-blue-100 text-sm font-medium mb-1">산술 평균 (Mean)</div>
                            <div id="valMean" class="text-5xl font-bold tracking-tight leading-normal pb-1">-</div>
                            <div class="mt-4 flex gap-4 text-blue-100 text-sm border-t border-white/20 pt-4">
                                <div>
                                    <span class="opacity-70">합계:</span> <span id="valSum" class="font-semibold text-white ml-1">-</span>
                                </div>
                                <div>
                                    <span class="opacity-70">개수:</span> <span id="valCount" class="font-semibold text-white ml-1">-개</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
                                <div class="flex items-start justify-between mb-2">
                                    <div class="p-2 bg-white rounded-lg shadow-sm">
                                        <i data-lucide="trending-up" class="w-5 h-5 text-emerald-500"></i>
                                    </div>
                                </div>
                                <div class="text-slate-500 text-xs font-medium mb-1">중앙값 (Median)</div>
                                <div id="valMedian" class="text-slate-800 font-bold text-lg truncate leading-relaxed pb-1">-</div>
                                <div class="text-slate-400 text-[10px] mt-1">데이터의 중앙 위치</div>
                            </div>

                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
                                <div class="flex items-start justify-between mb-2">
                                    <div class="p-2 bg-white rounded-lg shadow-sm">
                                        <i data-lucide="bar-chart-3" class="w-5 h-5 text-purple-500"></i>
                                    </div>
                                </div>
                                <div class="text-slate-500 text-xs font-medium mb-1">최빈값 (Mode)</div>
                                <div id="valMode" class="text-slate-800 font-bold text-lg truncate leading-relaxed pb-1">-</div>
                                <div class="text-slate-400 text-[10px] mt-1">가장 자주 나온 수</div>
                            </div>

                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
                                <div class="flex items-start justify-between mb-2">
                                    <div class="p-2 bg-white rounded-lg shadow-sm">
                                        <i data-lucide="maximize-2" class="w-5 h-5 text-orange-500"></i>
                                    </div>
                                </div>
                                <div class="text-slate-500 text-xs font-medium mb-1">최대값 (Max)</div>
                                <div id="valMax" class="text-slate-800 font-bold text-lg truncate leading-relaxed pb-1">-</div>
                                <div class="text-slate-400 text-[10px] mt-1">가장 큰 수</div>
                            </div>

                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
                                <div class="flex items-start justify-between mb-2">
                                    <div class="p-2 bg-white rounded-lg shadow-sm">
                                        <i data-lucide="minimize-2" class="w-5 h-5 text-cyan-500"></i>
                                    </div>
                                </div>
                                <div class="text-slate-500 text-xs font-medium mb-1">최소값 (Min)</div>
                                <div id="valMin" class="text-slate-800 font-bold text-lg truncate leading-relaxed pb-1">-</div>
                                <div class="text-slate-400 text-[10px] mt-1">가장 작은 수</div>
                            </div>

                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
                                <div class="flex items-start justify-between mb-2">
                                    <div class="p-2 bg-white rounded-lg shadow-sm">
                                        <i data-lucide="hash" class="w-5 h-5 text-slate-500"></i>
                                    </div>
                                </div>
                                <div class="text-slate-500 text-xs font-medium mb-1">범위 (Range)</div>
                                <div id="valRange" class="text-slate-800 font-bold text-lg truncate leading-relaxed pb-1">-</div>
                                <div class="text-slate-400 text-[10px] mt-1">최대값 - 최소값</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 text-center text-slate-400 text-sm">
            입력값은 쉼표(,), 띄어쓰기, 줄바꿈으로 자동 구분됩니다.
        </div>
    </div>

        <script>
        lucide.createIcons();

        const inputText = document.getElementById('inputText');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const placeholderState = document.getElementById('placeholderState');
        const resultState = document.getElementById('resultState');
        const actionButtons = document.getElementById('actionButtons');

        const elMean = document.getElementById('valMean');
        const elSum = document.getElementById('valSum');
        const elCount = document.getElementById('valCount');
        const elMedian = document.getElementById('valMedian');
        const elMode = document.getElementById('valMode');
        const elMax = document.getElementById('valMax');
        const elMin = document.getElementById('valMin');
        const elRange = document.getElementById('valRange');

        let currentResults = null;

        function loadExample() {
            inputText.value = '85, 92, 78, 90, 88, 76, 95, 85';
            hideError();
        }

        function handleClear() {
            inputText.value = '';
            hideError();
            currentResults = null;
            placeholderState.classList.remove('hidden');
            resultState.classList.add('hidden');
            actionButtons.classList.add('hidden');
        }

        function showError(msg) {
            errorMessage.classList.remove('hidden');
            errorText.textContent = msg;
            placeholderState.classList.remove('hidden');
            resultState.classList.add('hidden');
            actionButtons.classList.add('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
            errorText.textContent = '';
        }

        function handleCalculate() {
            hideError();
            
            const numbers = inputText.value
                .split(/[,\s\n]+/)
                .map(str => str.trim())
                .filter(str => str !== '')
                .map(Number);

            if (numbers.length === 0) {
                showError('숫자를 입력해주세요.');
                return;
            }

            if (numbers.some(isNaN)) {
                showError('유효하지 않은 숫자가 포함되어 있습니다.');
                return;
            }

            const sortedNumbers = [...numbers].sort((a, b) => a - b);
            const sum = numbers.reduce((acc, curr) => acc + curr, 0);
            const count = numbers.length;
            const mean = sum / count;

            let median;
            const mid = Math.floor(count / 2);
            if (count % 2 === 0) {
                median = (sortedNumbers[mid - 1] + sortedNumbers[mid]) / 2;
            } else {
                median = sortedNumbers[mid];
            }

            const frequency = {};
            let maxFreq = 0;
            numbers.forEach((num) => {
                frequency[num] = (frequency[num] || 0) + 1;
                if (frequency[num] > maxFreq) maxFreq = frequency[num];
            });

            let mode = [];
            if (maxFreq > 1) {
                for (const num in frequency) {
                    if (frequency[num] === maxFreq) {
                        mode.push(Number(num));
                    }
                }
            }
            const modeStr = mode.length > 0 ? mode.sort((a,b)=>a-b).join(', ') : '없음';
            
            const min = sortedNumbers[0];
            const max = sortedNumbers[count - 1];
            const range = max - min;
            const meanFormatted = Number.isInteger(mean) ? mean : mean.toFixed(2).replace(/\.00$/, '');

            currentResults = {
                mean: meanFormatted,
                sum,
                count,
                median,
                mode: modeStr,
                max,
                min,
                range
            };

            elMean.textContent = meanFormatted;
            elSum.textContent = sum;
            elCount.textContent = count + '개';
            elMedian.textContent = median;
            elMode.textContent = modeStr;
            elMax.textContent = max;
            elMin.textContent = min;
            elRange.textContent = range;

            placeholderState.classList.add('hidden');
            resultState.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
        }

        function copyResult() {
            if (!currentResults) return;
            const text = `평균: ${currentResults.mean}\n중앙값: ${currentResults.median}\n최빈값: ${currentResults.mode}\n최대값: ${currentResults.max}\n최소값: ${currentResults.min}\n범위: ${currentResults.range}`;
            
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            // 버튼 상태 변경
            const copyBtn = actionButtons.querySelector('button[onclick="copyResult()"]');
            const originalIcon = copyBtn.innerHTML;
            
            // 연한 초록색 배경과 체크 아이콘 적용
            copyBtn.innerHTML = `<i data-lucide="check" class="w-5 h-5 text-green-600"></i>`;
            copyBtn.classList.remove('hover:bg-slate-100', 'text-slate-400');
            copyBtn.classList.add('bg-green-100');
            
            // 아이콘 다시 렌더링
            lucide.createIcons({
                nameAttr: 'data-lucide',
                root: copyBtn
            });

            // 1초 후 원래 상태로 복구
            setTimeout(() => {
                copyBtn.innerHTML = originalIcon;
                copyBtn.classList.add('hover:bg-slate-100', 'text-slate-400');
                copyBtn.classList.remove('bg-green-100');
                lucide.createIcons({
                    nameAttr: 'data-lucide',
                    root: copyBtn
                });
            }, 1000);
        }

        function downloadImage() {
            const captureArea = document.getElementById('captureArea');
            const btns = document.getElementById('actionButtons');
            
            btns.style.display = 'none';
            
            html2canvas(captureArea, {
                scale: 2,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                btns.style.display = '';
                
                const link = document.createElement('a');
                link.download = '계산결과.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                btns.style.display = '';
                alert('이미지 저장 중 오류가 발생했습니다.');
            });
        }
    </script>
</body>
</html>
