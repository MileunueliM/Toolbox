<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑇𝑜𝑜𝑙𝑏𝑜𝑥</title>
    <link rel="icon" type="image/png" href="./favicon.png">

    <style>
        :root {
            --bg: #f5f7fb;
            --text: #172033;
            --muted: #667085;
            --card-size: 210px;
            --radius: 28px;
            --overlay: rgba(255, 255, 255, 0.94);
            --shadow: 0 14px 40px rgba(15, 23, 42, 0.10);
            --shadow-hover: 0 22px 52px rgba(15, 23, 42, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Noto Sans KR", Arial, sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(255,255,255,0.18), transparent 28%),
                radial-gradient(circle at 88% 82%, rgba(255,255,255,0.10), transparent 24%),
                linear-gradient(135deg, #5f7ce8 0%, #7068d8 48%, #8451b4 100%);
            color: var(--text);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            background:
                radial-gradient(circle at 30% 25%, rgba(255,255,255,0.10), transparent 22%),
                radial-gradient(circle at 75% 65%, rgba(255,255,255,0.08), transparent 20%);
            filter: blur(28px);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 76px 24px 64px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 52px;
        }

        .header h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            font-size: clamp(2.4rem, 5vw, 4.4rem);
            font-weight: 700;
            letter-spacing: -0.045em;
            color: #ffffff;
            text-shadow: 0 8px 28px rgba(31, 28, 84, 0.20);
        }

        .header p {
            margin: 12px 0 0;
            color: rgba(255,255,255,0.80);
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .tool-grid {
            width: min(920px, 100%);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, var(--card-size)));
            justify-content: center;
            gap: 28px;
        }

        .tool-card {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: var(--radius);
            overflow: hidden;
            background: rgba(255,255,255,0.96);
            box-shadow: 0 18px 44px rgba(34, 28, 92, 0.18);
            border: 1px solid rgba(255,255,255,0.45);
            text-decoration: none;
            color: inherit;
            transform: translateY(0);
            transition: transform 220ms ease, box-shadow 220ms ease;
            isolation: isolate;
        }

        .tool-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 58px rgba(34, 28, 92, 0.26);
        }

        .tool-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .tool-overlay {
            position: absolute;
            inset: 0;
            background: var(--overlay);
            transform: translateY(100%);
            transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 26px;
            text-align: center;
            z-index: 2;
        }

        .tool-card:hover .tool-overlay,
        .tool-card:focus-visible .tool-overlay {
            transform: translateY(0);
        }

        .tool-info {
            width: 100%;
            transform: translateY(18px);
            opacity: 0;
            transition:
                transform 260ms cubic-bezier(0.22, 1, 0.36, 1) 70ms,
                opacity 220ms ease 70ms;
        }

        .tool-card:hover .tool-info,
        .tool-card:focus-visible .tool-info {
            transform: translateY(0);
            opacity: 1;
        }

        .tool-name {
            margin: 0;
            font-size: 1.28rem;
            font-weight: 750;
            letter-spacing: -0.03em;
        }

        .tool-description {
            margin: 10px 0 0;
            color: #5f6878;
            font-size: 0.9rem;
            line-height: 1.65;
            word-break: keep-all;
        }

        .tool-arrow {
            margin-top: 17px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #394150;
            font-size: 0.82rem;
            font-weight: 650;
        }

        .tool-card:focus-visible {
            outline: 3px solid rgba(59, 130, 246, 0.35);
            outline-offset: 5px;
        }

        .footer {
            margin-top: 54px;
            color: rgba(255,255,255,0.52);
            font-size: 0.76rem;
            text-align: center;
        }

        @media (max-width: 620px) {
            .page {
                padding: 48px 18px 40px;
            }

            .header {
                margin-bottom: 34px;
            }

            .tool-grid {
                grid-template-columns: minmax(0, 1fr);
                width: min(360px, 100%);
                gap: 20px;
            }

            .tool-card {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>Toolbox</h1>
            <p>필요한 도구를 선택하세요.</p>
        </header>

        <section class="tool-grid" aria-label="도구 목록">
            <a class="tool-card" href="./comment-eraser/" aria-label="Comment Eraser 열기">
                <img class="tool-icon" src="./icons/comment-eraser.png" alt="Comment Eraser 로고">
                <div class="tool-overlay">
                    <div class="tool-info">
                        <h2 class="tool-name">Comment Eraser</h2>
                        <p class="tool-description">HTML, CSS, JavaScript 코드의 주석을 제거하는 도구입니다.</p>
                        <div class="tool-arrow">열기 →</div>
                    </div>
                </div>
            </a>

            <a class="tool-card" href="./italicify/" aria-label="Italicify 열기">
                <img class="tool-icon" src="./icons/italicify.png" alt="Italicify 로고">
                <div class="tool-overlay">
                    <div class="tool-info">
                        <h2 class="tool-name">Italicify</h2>
                        <p class="tool-description">입력한 영문 텍스트를 이탤릭 스타일로 빠르게 변환합니다.</p>
                        <div class="tool-arrow">열기 →</div>
                    </div>
                </div>
            </a>

            <a class="tool-card" href="./statistics-calculator/" aria-label="Statistics Calculator 열기">
                <img class="tool-icon" src="./icons/statistics-calculator.png" alt="Statistics Calculator 로고">
                <div class="tool-overlay">
                    <div class="tool-info">
                        <h2 class="tool-name">Statistics Calculator</h2>
                        <p class="tool-description">평균, 중앙값, 최빈값, 최대·최소값과 범위를 계산합니다.</p>
                        <div class="tool-arrow">열기 →</div>
                    </div>
                </div>
            </a>

            <a class="tool-card" href="./textcounter/" aria-label="Textcounter 열기">
                <img class="tool-icon" src="./icons/textcounter.png" alt="Textcounter 로고">
                <div class="tool-overlay">
                    <div class="tool-info">
                        <h2 class="tool-name">Textcounter</h2>
                        <p class="tool-description">글자 수, 공백 제외, 단어 수, 단락 수, 문장 수를 계산합니다.</p>
                        <div class="tool-arrow">열기 →</div>
                    </div>
                </div>
            </a>
        </section>

    </main>
</body>
</html>
